  <path d="M22 28H28M25 25V31" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Action Buttons Right -->
  <circle cx="38" cy="27" r="2.2" fill="#f43f5e" filter="url(#neonGlow)"/>
  <circle cx="42" cy="31" r="2.2" fill="#fbbf24" filter="url(#neonGlow)"/>
  <!-- Glowing Bottom Paddle Beam -->
  <rect x="18" y="48" width="28" height="4" rx="2" fill="#06b6d4" filter="url(#neonGlow)"/>
  <!-- Falling Neon Energy Orb -->
  <circle cx="32" cy="12" r="3.5" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
