<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neonArcadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070913"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#neonArcadeGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Arcade Joystick / Paddle Silhouette -->
  <path d="M16 28C16 24 20 20 25 20H39C44 20 48 24 48 28V36C48 40 44 44 39 44H25C20 44 16 40 16 36V28Z" fill="#121628" stroke="#6366f1" stroke-width="2"/>
